<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guide touristique</title>
    <style>
        body { font: 1rem/1.6 system-ui, sans-serif; max-width: 38rem; margin: 3rem auto; padding: 0 1rem; }
        form { display: grid; gap: .5rem; max-width: 22rem; }
        input, button { font: inherit; padding: .4rem .6rem; }
        button { justify-self: start; }
    </style>
</head>
<body>
<main>
    <h1>Guide touristique</h1>
    <form id="recherche">
        <label for="lieu">Ville ou pays</label>
        <input id="lieu" name="lieu" required>
        <label for="nb">Nombre d’endroits à visiter</label>
        <input id="nb" name="nb" type="number" min="1" step="1" value="2" required>
        <button type="submit">Rechercher</button>
    </form>
    <p id="etat" role="status"></p>
    <section id="resultat" hidden>
        <h2 id="destination"></h2>
        <ul id="visites"></ul>
        <p>Prix moyen d’un repas <strong id="prix"></strong></p>
    </section>
</main>
<script>
    const endpoint = 'http://localhost:8080/TP3-ALAMI_LOUATI_Ghali-1.0-SNAPSHOT/api/guide/lieu/';
    const formulaire = document.querySelector('#recherche');
    const bouton = formulaire.querySelector('button');
    const etat = document.querySelector('#etat');
    const resultat = document.querySelector('#resultat');

    formulaire.addEventListener('submit', async (event) => {
        event.preventDefault();
        const lieu = formulaire.elements.lieu.value.trim();
        if (!lieu) {
            etat.textContent = 'Indiquez une ville ou un pays.';
            return;
        }

        bouton.disabled = true;
        resultat.hidden = true;
        etat.textContent = 'Recherche en cours…';

        try {
            const url = new URL(endpoint + encodeURIComponent(lieu));
            url.searchParams.set('nb', formulaire.elements.nb.value);
            const reponse = await fetch(url);
            const infos = await reponse.json();
            if (!reponse.ok) {
                throw new Error(infos.erreur || 'Erreur HTTP ' + reponse.status);
            }

            document.querySelector('#destination').textContent = infos.ville_ou_pays;
            document.querySelector('#prix').textContent = infos.prix_moyen_repas;
            const elements = infos.endroits_a_visiter.map((visite) => {
                const element = document.createElement('li');
                element.textContent = visite;
                return element;
            });
            document.querySelector('#visites').replaceChildren(...elements);
            resultat.hidden = false;
            etat.textContent = '';
        } catch (erreur) {
            etat.textContent = 'Recherche impossible. ' + erreur.message;
        } finally {
            bouton.disabled = false;
        }
    });
</script>
</body>
</html>
